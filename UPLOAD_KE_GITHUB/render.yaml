# ==============================================================================
# RAHUL LIGHT — RENDER DEPLOYMENT BLUEPRINT
# Host free Node.js Web Service on https://render.com
# ==============================================================================

services:
  - type: web
    name: rahul-light-ma2-downgrader
    env: node
    plan: free
    region: singapore # Closest low-latency region for Indonesia / Southeast Asia
    buildCommand: npm install --production
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
